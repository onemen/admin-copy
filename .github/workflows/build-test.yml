name: Build & Test

on:
  workflow_call:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: make

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: make

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/test_dst
          echo "hello" > /tmp/test_src.txt
          ./dist/helper_linux /tmp/test_src.txt /tmp/test_dst/copied.txt
          diff /tmp/test_src.txt /tmp/test_dst/copied.txt
          echo "Normal copy OK"
          sudo ./dist/helper_linux /tmp/test_src.txt /etc/test_copied.txt
          diff /tmp/test_src.txt /etc/test_copied.txt
          sudo rm /etc/test_copied.txt
          echo "Elevated copy OK"
          rm -rf /tmp/test_dst

      - name: Test (macOS)
        if: runner.os == 'macOS'
        env:
          CI: "true"
        run: |
          mkdir -p /tmp/test_dst
          echo "hello" > /tmp/test_src.txt
          ./dist/helper_mac /tmp/test_src.txt /tmp/test_dst/copied.txt
          diff /tmp/test_src.txt /tmp/test_dst/copied.txt
          echo "Normal copy OK"
          sudo ./dist/helper_mac /tmp/test_src.txt /etc/test_copied.txt
          diff /tmp/test_src.txt /etc/test_copied.txt
          sudo rm /etc/test_copied.txt
          echo "Elevated copy OK"
          rm -rf /tmp/test_dst

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Run-Helper($src, $dst) {
            $p = Start-Process -FilePath ".\dist\helper_win.exe" `
              -ArgumentList @($src, $dst) -Wait -PassThru
            return $p.ExitCode
          }

          $tmpSrc = "$env:TEMP\test_src.txt"
          $tmpDst = "$env:TEMP\test_dst"
          New-Item -ItemType Directory -Path $tmpDst -Force | Out-Null
          "hello" | Out-File -NoNewline -Encoding ascii $tmpSrc

          $ec = Run-Helper $tmpSrc "$tmpDst\copied.txt"
          if ($ec -ne 0) { Write-Host "helper_win exit: $ec"; exit $ec }
          if (-not (Test-Path "$tmpDst\copied.txt")) { exit 3 }
          Write-Host "Normal copy OK"

          $hebrewSrc = "$env:TEMP\src_test.txt"
          $hebrewDst = "$env:ProgramFiles\בדיקה\test.txt"
          "שלום-תוכן" | Out-File -NoNewline -Encoding utf8NoBOM $hebrewSrc
          $ec2 = Run-Helper $hebrewSrc $hebrewDst
          if (Test-Path $hebrewDst) {
            Write-Host "Unicode copy OK (elevated)"
            Remove-Item -Force $hebrewDst
          } else {
            Write-Host "Unicode copy skipped (exit $ec2, no elevation in CI)"
          }
          Remove-Item -Force "$tmpDst\copied.txt" -ErrorAction SilentlyContinue

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: dist/