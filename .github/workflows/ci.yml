name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml

  upload-dev-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-Windows
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: build-Linux
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: build-macOS
          path: dist/

      - name: Upload to dev-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          gh release view dev-build --repo "$REPO" 2>/dev/null || \
            gh release create dev-build --repo "$REPO" --title "Dev Build" --prerelease

          ls -la dist/
          for f in dist/*; do
            [ -f "$f" ] && gh release upload dev-build --repo "$REPO" "$f" --clobber
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move dev-build tag to HEAD
        run: |
          git tag -d dev-build 2>/dev/null || true
          git tag dev-build HEAD
          git push origin -f dev-build

  upload-pr-artifacts:
    if: github.event_name == 'pull_request'
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-Windows
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: build-Linux
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: build-macOS
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: pr-builds
          path: dist/