name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml

  create-release:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"

          gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes

          for f in dist/*; do
            gh release upload "$TAG" --repo "$REPO" "$f"
          done